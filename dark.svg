<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610"
 role="img" aria-label="Praveen B.M. — Data Analyst and ML Enthusiast">
<title>Praveen B.M. — Data Analyst · ML Enthusiast</title>
<desc>Premium terminal-style profile banner with a high-contrast ASCII portrait, technical identity, selected stack and projects.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#07111F"/><stop offset="1" stop-color="#0F172A"/>
  <animate attributeName="x2" values="1;.75;1" dur="18s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" x2="1">
  <stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/>
  <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
 </linearGradient>
 <radialGradient id="glow1"><stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow2"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".15"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".12" stroke-width="1"/>
 </pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity=".34"/>
 </filter>
 <filter id="portraitGlow" x="-25%" y="-25%" width="150%" height="150%">
  <feGaussianBlur stdDeviation="2.5" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <style>
  .mono {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .ascii {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; letter-spacing:-.08px; white-space:pre}
  .label {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10.5px;letter-spacing:1.8px}
  .value {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}
  .small {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10px}
  .body {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}
 </style>
</defs>

