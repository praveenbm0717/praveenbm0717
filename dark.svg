<title>Praveen B.M. — Data Analyst · ML Enthusiast</title>
<desc>Dark terminal-style GitHub profile banner with an ASCII portrait, technical identity, stack and selected projects.</desc>

<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#02050B"/>
  <stop offset=".52" stop-color="#07111F"/>
  <stop offset="1" stop-color="#0B1220"/>
  <animate attributeName="x2" values="1;.78;1" dur="18s" repeatCount="indefinite"/>
 </linearGradient>
 <linearGradient id="accent" x1="0" x2="1">
  <stop offset="0" stop-color="#7C3AED"/>
  <stop offset=".5" stop-color="#22D3EE"/>
  <stop offset="1" stop-color="#10B981"/>
  <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
 </linearGradient>
 <radialGradient id="cyanGlow">
  <stop offset="0" stop-color="#22D3EE" stop-opacity=".17"/>
  <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="violetGlow">
  <stop offset="0" stop-color="#7C3AED" stop-opacity=".14"/>
  <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
 </radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".10" stroke-width="1"/>
 </pattern>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".42"/>
 </filter>
 <filter id="portraitGlow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.2" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <style>
  .ascii {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
            font-size:8px;letter-spacing:.15px;white-space:pre;fill:#67E8F9}
  .label {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10.5px;letter-spacing:1.8px}
  .value {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}
  .small {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:10px}
  .body {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px}
 </style>
</defs>

