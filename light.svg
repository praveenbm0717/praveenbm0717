<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1180" height="610" viewBox="0 0 1180 610"
     role="img"
     aria-label="Praveen B.M. — Data Analyst and ML Enthusiast, transitioning from Mechanical Engineering into Data and AI">
  <title>Praveen B.M. — Data Analyst · ML Enthusiast</title>
  <desc>Terminal-style GitHub profile banner with a high-contrast ASCII portrait, technical identity, stack and selected projects.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
      <animate attributeName="x2" values="1;.75;1" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="48%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#0891B2" stop-opacity=".17"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CBD5E1" stroke-opacity=".17" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".12"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 6.8px; letter-spacing: .05px; white-space: pre; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 10.5px; letter-spacing: 1.7px; }
      .value { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 13px; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
                font-size: 10px; }
      .body { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
               font-size: 13px; }
    </style>
  </defs>

  <rect x="2" y="2" width="1176" height="606" rx="24" fill="url(#bg)" stroke="#CBD5E1" stroke-opacity=".55"/>
  <rect x="2" y="2" width="1176" height="606" rx="24" fill="url(#grid)"/>

  <circle cx="210" cy="175" r="250" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values=".55;.9;.55" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="480" r="290" fill="url(#violetGlow)">
    <animate attributeName="opacity" values=".55;.82;.55" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal chrome -->
  <rect x="20" y="18" width="1140" height="42" rx="12"
